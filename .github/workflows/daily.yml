name: MCP Trust Index — daily scan

on:
  schedule:
    - cron: "17 3 * * *"     # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate gh (needs >1,000 public-repo lookups/hr)
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token
          gh auth status

      - name: Run pipeline
        run: bash run_daily.sh

      - name: Commit data
        run: |
          git config user.name  "mcp-trust-index bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site reports snapshots 2>/dev/null || true
          git diff --quiet --cached || git commit -m "index: $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
